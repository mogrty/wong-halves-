<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wong Halves Counter</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --fg: #222;
      --card: #fff;
      --accent: #007bff;
    }

    [data-theme="dark"] {
      --bg: #111;
      --fg: #eee;
      --card: #1d1d1d;
      --accent: #00bcd4;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      font-size: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
    }

    label {
      margin-top: 1rem;
      display: block;
    }

    input, button, select {
      font-size: 1rem;
      padding: 0.85rem;
      width: 100%;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .controls, .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .controls button, .quick-buttons button {
      flex: 1 1 40%;
      min-width: 120px;
      font-size: 1.1rem;
    }

    .output {
      margin-top: 1rem;
      background: var(--card);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      position: relative;
    }

    .emoji {
      position: absolute;
      top: 10px;
      right: 10px;
      text-align: center;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .hidden {
      display: none;
    }

    pre {
      margin: 0;
      font-family: inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-x: auto;
      font-size: 0.95rem;
    }

    @media (max-width: 450px) {
      body {
        font-size: 0.9rem;
        padding: 0.75rem;
      }

      .controls button, .quick-buttons button {
        flex: 1 1 48%;
        font-size: 1rem;
        min-width: unset;
      }

      .output pre {
        font-size: 0.85rem;
      }

      .emoji div {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

<h1>📊 Wong Halves Counter</h1>

<label for="deckInput">Number of decks at start:</label>
<input type="number" id="deckInput" placeholder="e.g. 6" min="1" step="0.5" />

<label for="inputMode">Select input method:</label>
<select id="inputMode" onchange="switchInputMode()">
  <option value="cards">Card Entry</option>
  <option value="buttons">Quick Count Buttons</option>
</select>

<div id="cardInputSection">
  <label for="cardInput">Dealt cards:</label>
  <input type="text" id="cardInput" placeholder="e.g. A, 10, 4, 3, Q" />
</div>

<div id="buttonInputSection" class="hidden">
  <label>Add count directly:</label>
  <div class="quick-buttons">
    <button onclick="applyManualCount(-1)">-1</button>
    <button onclick="applyManualCount(-0.5)">-0.5</button>
    <button onclick="applyManualCount(0)">0</button>
    <button onclick="applyManualCount(0.5)">+0.5</button>
    <button onclick="applyManualCount(1)">+1</button>
    <button onclick="applyManualCount(1.5)">+1.5</button>
  </div>
</div>

<div class="controls">
  <button onclick="processInput()">➕ Count</button>
  <button onclick="resetCounter()">🔁 Reset</button>
  <button onclick="undo()">↩️ Undo</button>
  <button onclick="redo()">↪️ Redo</button>
  <button onclick="toggleDarkMode()">🌓 Theme</button>
</div>

<div class="output" id="output"></div>
<div class="emoji" id="emojiDisplay"></div>

<div class="footer">created by Razon</div>

<script>
let runningCount = 0;
let totalCardsDealt = 0;
let totalCards = 0;
const CARDS_PER_DECK = 52;

const wongValues = {
  "2": 0.5, "3": 1.0, "4": 1.0, "5": 1.5, "6": 1.0,
  "7": 0.5, "8": 0, "9": -0.5, "10": -1.0,
  "j": -1.0, "q": -1.0, "k": -1.0, "a": -1.0
};

let historyStack = [];
let redoStack = [];

function saveState() {
  localStorage.setItem("wongState", JSON.stringify({
    runningCount, totalCardsDealt, totalCards
  }));
}

function loadState() {
  const saved = JSON.parse(localStorage.getItem("wongState"));
  if (saved) {
    runningCount = saved.runningCount;
    totalCardsDealt = saved.totalCardsDealt;
    totalCards = saved.totalCards;
    updateOutput(0);
  }
}

function pushHistory() {
  historyStack.push({ runningCount, totalCardsDealt, totalCards });
  if (historyStack.length > 100) historyStack.shift();
  redoStack = [];
}

function undo() {
  if (historyStack.length > 0) {
    redoStack.push({ runningCount, totalCardsDealt, totalCards });
    const prev = historyStack.pop();
    runningCount = prev.runningCount;
    totalCardsDealt = prev.totalCardsDealt;
    totalCards = prev.totalCards;
    updateOutput(0);
  }
}

function redo() {
  if (redoStack.length > 0) {
    pushHistory();
    const next = redoStack.pop();
    runningCount = next.runningCount;
    totalCardsDealt = next.totalCardsDealt;
    totalCards = next.totalCards;
    updateOutput(0);
  }
}

function processInput() {
  const mode = document.getElementById("inputMode").value;
  if (mode === "cards") {
    processCards();
  }
}

function applyManualCount(value) {
  if (totalCards === 0) {
    const decks = parseFloat(document.getElementById("deckInput").value);
    if (!decks || decks <= 0) {
      alert("Enter decks first!");
      return;
    }
    totalCards = decks * CARDS_PER_DECK;
  }
  pushHistory();
  runningCount += value;
  totalCardsDealt += 1;
  saveState();
  updateOutput(0);
}

function processCards() {
  const deckInput = document.getElementById("deckInput");
  const cardInput = document.getElementById("cardInput");

  if (totalCards === 0) {
    const decks = parseFloat(deckInput.value);
    if (!decks || decks <= 0) {
      alert("Enter decks first!");
      return;
    }
    totalCards = decks * CARDS_PER_DECK;
  }

  const input = cardInput.value.trim().toLowerCase().replace(/,/g, " ");
  const cards = input.split(/\s+/).filter(Boolean);

  let roundCount = 0;
  cards.forEach(card => {
    if (wongValues.hasOwnProperty(card)) {
      roundCount += wongValues[card];
    }
  });

  pushHistory();
  runningCount += roundCount;
  totalCardsDealt += cards.length;
  saveState();
  updateOutput(cards.length);
  cardInput.value = "";
}

function getStrategyTips(tc) {
  if (tc >= 4) {
    return "🔥 Max bet! Consider deviating from basic strategy.\n- Stand on 16 vs 10\n- Take insurance";
  } else if (tc >= 2) {
    return "🟢 Raise your bet.\n- Consider insurance\n- Stand on 15 vs 10";
  } else if (tc >= 1) {
    return "🟡 Slight edge. Moderate bets.";
  } else if (tc >= 0) {
    return "⚪ Neutral. Bet minimum.";
  } else {
    return "🔻 Negative count. Bet minimum or sit out.";
  }
}

function updateOutput(roundCards) {
  const output = document.getElementById("output");
  const emojiDisplay = document.getElementById("emojiDisplay");

  let cardsRemaining = totalCards - totalCardsDealt;
  let decksRemaining = cardsRemaining / CARDS_PER_DECK;
  if (decksRemaining < 0.25) decksRemaining = 0.25;

  const trueCount = runningCount / decksRemaining;
  const winPercent = Math.min(100, Math.max(0, (trueCount * 5 + 50).toFixed(1)));
  const emoji = (trueCount >= 2) ? "🟢" : "";

  emojiDisplay.innerHTML = `
    <div style="font-size: 1.75rem;">${emoji}</div>
    <small><b>Win %:</b> ${winPercent}%</small>
  `;

  output.innerHTML = `
    ${roundCards > 0 ? `<b>Cards this round:</b> ${roundCards}<br>` : ""}
    <b>Total cards dealt:</b> ${totalCardsDealt}<br>
    <b>Decks remaining:</b> ${decksRemaining.toFixed(2)}<br>
    <b>Running Count:</b> ${runningCount.toFixed(2)}<br>
    <b>True Count:</b> ${trueCount.toFixed(2)}<br>
    <hr>
    <pre>${getStrategyTips(trueCount)}</pre>
  `;
}

function resetCounter() {
  if (confirm("Reset everything?")) {
    runningCount = 0;
    totalCardsDealt = 0;
    totalCards = 0;
    historyStack = [];
    redoStack = [];
    localStorage.removeItem("wongState");
    document.getElementById("deckInput").value = "";
    document.getElementById("cardInput").value = "";
    document.getElementById("output").innerHTML = "";
    document.getElementById("emojiDisplay").innerHTML = "";
  }
}

function toggleDarkMode() {
  const theme = document.documentElement.getAttribute("data-theme");
  const newTheme = theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", newTheme);
  localStorage.setItem("theme", newTheme);
}

function switchInputMode() {
  const mode = document.getElementById("inputMode").value;
  document.getElementById("cardInputSection").classList.toggle("hidden", mode !== "cards");
  document.getElementById("buttonInputSection").classList.toggle("hidden", mode !== "buttons");
}

(function init() {
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme) {
    document.documentElement.setAttribute("data-theme", savedTheme);
  }
  loadState();
})();
</script>

</body>
</html>
